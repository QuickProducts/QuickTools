name: Windows build and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build application
        shell: pwsh
        run: ./build.ps1
      - name: Publish app and setup
        shell: pwsh
        run: ./build-setup.ps1
      - name: Calculate installer checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash release/QuickToolsSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  QuickToolsSetup.exe" | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: QuickTools-Windows-x64
          path: |
            release/QuickToolsSetup.exe
            release/SHA256SUMS.txt
      - name: Publish preview release if missing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([xml](Get-Content QuickTools.csproj)).Project.PropertyGroup.Version
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists; keeping its assets."; exit 0 }
          gh release create $tag release/QuickToolsSetup.exe release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "QuickTools $version" --prerelease --notes-file docs/RELEASE.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
  wiki:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Sync maintained Wiki pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth_header"
          wiki_url="https://github.com/${GITHUB_REPOSITORY}.wiki.git"
          git -c "http.extraHeader=AUTHORIZATION: basic $auth_header" clone "$wiki_url" /tmp/quicktools-wiki
          cp docs/wiki/*.md /tmp/quicktools-wiki/
          cd /tmp/quicktools-wiki
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.md'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync QuickTools documentation'
          git -c "http.extraHeader=AUTHORIZATION: basic $auth_header" push origin HEAD
